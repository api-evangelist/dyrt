name: Dyrt
description: >-
  The Dyrt is a camping discovery and booking platform for the United States,
  covering public and private campgrounds, RV parks, glamping, cabins, and free
  dispersed camping. It is a community-driven service built on user-contributed
  reviews, photos, and campground details, layered with trip-planning tools,
  real-time availability, and direct booking for many locations. Its Dyrt PRO
  subscription adds offline maps, cancellation ("Scan Canceled Sites") alerts,
  curated free-camping data, and discounts at 1,000+ campgrounds. The Dyrt also
  offers free listings, dashboards, analytics, and marketing tools for campground
  owners. It has been featured by the New York Times, NPR, National Geographic,
  and Forbes. Surfaced as a Techstars portfolio company and added to the API
  Evangelist network; The Dyrt publishes a consumer web/mobile product and does
  not expose a documented public developer API at this time.
